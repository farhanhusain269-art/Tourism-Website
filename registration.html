<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Registration.css">
</head>
<body>
    <div class="container">
    <h2 class="logo"> 🌍 Tourism & Hospitality Registration</h2>

    <form>

    <div class="input-group">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" required>
    </div>

    <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>
    </div>

    <div class="input-group">
        <label>Phone Number</label>
        <input type="tel" placeholder="Enter your phone number" required>
    </div>

    <div class="input-group">
        <label>Country</label>
        <select required>
            <option value="">Select Country</option>
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
            <option>Australia</option>
        </select>
    </div>

    <div class="input-group full-width">
        <label>Gender</label>
        <div class="gender">
            <label><input type="radio" name="gender"> Male</label>
            <label><input type="radio" name="gender"> Female</label>
            <label><input type="radio" name="gender"> Other</label>
        </div>
    </div>

    <div class="input-group">
        <label>Travel Preference</label>
        <select>
            <option>Adventure</option>
            <option>Luxury</option>
            <option>Budget</option>
            <option>Family Trip</option>
        </select>
    </div>

    <div class="input-group">
        <label>Travel Date</label>
        <input type="date">
    </div>

    <div class="input-group full-width">
        <label>Message / Special Request</label>
        <textarea rows="3" placeholder="Any special requirements..."></textarea>
    </div>

    <div class="input-group full-width">
        <button type="submit" class="Reg-btn">Register Now</button>
    </div>

</form>
</div>
</body>
</html>
