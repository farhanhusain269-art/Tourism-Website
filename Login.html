<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">Tourism & Hospitality</div>
        <h2>Welcome Back</h2>
        <p>Login to explore destinations</p>

        <form>
            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
            </div>
            <div class="input-group">
                <label>Phone number</label>
                <input type="number" placeholder="Enter Your Number">
            </div>

            <button type="submit" class="login-btn"><a href="index.html" target="_blank">Login</a></button>
        </form>

        <div class="extra-links">
            <p><a href="#">Forgot Password?</a></p>
            <p>Don't have an account? <a href="Resistration.html">Register</a></p>
        </div>
    </div>

</body>
</html>
